[package]
name = "oli-demo-rust-app"
version = "0.1.0"
edition = "2021"
description = "Stock card demo app for One Line Installer"
license = "MIT"
publish = false

[[bin]]
name = "oli-demo-rust-app"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
