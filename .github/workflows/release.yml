name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild
      - name: Refresh the embedded snapshot (keeps the committed one if Yahoo fails)
        run: cargo run --bin refresh-data || git checkout -- data/snapshot.json
      - name: Build static binaries
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --release --bin oli-demo-rust-app --target "$target"
          done
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/oli-demo-rust-app dist/oli-demo-rust-app-linux-amd64
          cp target/aarch64-unknown-linux-musl/release/oli-demo-rust-app dist/oli-demo-rust-app-linux-arm64
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
