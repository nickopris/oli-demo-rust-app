<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Card</title>
<style>
  :root {
    --bg: #0d0d0e;
    --panel: #121214;
    --line: #26262a;
    --line-strong: #3a3a40;
    --text: #e8e8ea;
    --muted: #8a8a92;
    --faint: #5c5c64;
    --accent: #6cc4f5;
    --good: #6fe0b4;
    --bad: #f3a6c4;
    --warn: #e4c46a;
    --bar-good: #2f8a66;
    --bar-mid: #8a7a2e;
    --bar-bad: #8a3c4c;
    --button: #0f1b26;
    --button-line: #22384a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px 64px; }

  /* Ticker band */
  .band {
    display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px;
    border-bottom: 1px solid var(--line); scrollbar-width: none;
  }
  .band::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; display: flex; gap: 8px; align-items: baseline;
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); color: var(--text); cursor: pointer; font: inherit; font-size: 13px;
  }
  .chip:hover, .chip.active { border-color: var(--accent); }
  .chip b { color: var(--accent); font-weight: 600; letter-spacing: .02em; }
  .chip .chg { font-size: 12px; }
  .up { color: var(--good); }
  .down { color: var(--bad); }

  /* Search */
  .search { display: flex; justify-content: center; gap: 28px; margin: 56px 0 44px; flex-wrap: wrap; }
  .field { position: relative; width: 276px; }
  .field input {
    width: 100%; height: 44px; padding: 0 14px; border-radius: 3px;
    border: 1px solid var(--line-strong); background: var(--bg); color: var(--text);
    font-family: inherit; font-size: 20px; text-transform: uppercase; letter-spacing: .02em;
  }
  .field input::placeholder { color: var(--faint); }
  .field input:focus { outline: none; border-color: var(--accent); }
  .btn {
    height: 44px; min-width: 114px; padding: 0 18px; border-radius: 3px; cursor: pointer;
    border: 1px solid var(--button-line); background: var(--button); color: var(--text);
    font-family: inherit; font-size: 16px; letter-spacing: .03em;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.ghost { color: var(--faint); }
  .suggest {
    position: absolute; top: 48px; left: 0; right: 0; z-index: 5; margin: 0; padding: 4px 0; list-style: none;
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: 3px;
  }
  .suggest li { display: flex; gap: 10px; padding: 8px 14px; cursor: pointer; }
  .suggest li b { color: var(--accent); min-width: 52px; }
  .suggest li.on, .suggest li:hover { background: #1b1b20; }

  /* Card */
  .cols {
    display: grid; grid-template-columns: 1fr 90px 90px 90px; gap: 0 12px;
    padding: 0 26px 10px; color: var(--faint); font-size: 16px; text-align: right;
  }
  .cols span:first-child { text-align: left; }
  .head {
    display: grid; grid-template-columns: 110px 1fr 90px 90px 90px; gap: 0 12px; align-items: center;
    padding: 14px 20px; border: 1px solid var(--line-strong); background: var(--panel);
  }
  .tk { color: var(--accent); font-size: 20px; font-weight: 700; letter-spacing: .02em; }
  .nm { font-size: 14px; }
  .sub { color: var(--muted); font-size: 12px; }
  .num { text-align: right; }
  .mcap { color: var(--muted); font-size: 13px; }
  .price { font-size: 15px; }
  .spark { justify-self: end; }

  .tip {
    display: flex; gap: 14px; align-items: baseline; margin: 0 0 4px; padding: 10px 20px;
    border: 1px solid var(--line); border-top: 0; background: #101013; font-size: 13px;
  }
  .tip .k { color: var(--warn); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .tip a { color: var(--text); text-decoration: none; }
  .tip a:hover .tt { text-decoration: underline; }
  .tip .tt { font-weight: 600; margin-right: 6px; }
  .tip .tx { color: var(--muted); }
  .tip .off { margin-left: auto; color: var(--faint); font-size: 11px; }

  .panel { padding: 18px 22px 0; }
  .who { font-weight: 600; font-size: 15px; }
  .who-sub { color: var(--faint); font-size: 12px; line-height: 1.4; }
  .asof { color: var(--faint); font-size: 12px; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 36px; border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
  .sec { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .sig { position: relative; display: flex; justify-content: space-between; gap: 12px; padding: 5px 0 4px; border-bottom: 1px solid #1c1c20; }
  .sig .n { font-size: 13px; }
  .sig .l { font-size: 11.5px; text-align: right; }
  .sig .l.na { color: var(--bad); }
  .sig i { position: absolute; left: 0; bottom: -1px; height: 1px; }
  .lower { display: grid; grid-template-columns: 1fr 1fr; gap: 0 36px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .kv { display: grid; grid-template-columns: 1fr 120px; max-width: 320px; font-size: 13px; row-gap: 4px; }
  .kv span:nth-child(even) { text-align: right; }
  .news { border-bottom: 1px solid #1c1c20; padding: 0 0 10px; margin-bottom: 10px; }
  .news:last-child { border: 0; }
  .news .top { display: flex; justify-content: space-between; gap: 12px; }
  .news a { color: var(--text); text-decoration: none; font-size: 13px; }
  .news a:hover { text-decoration: underline; }
  .news .age { color: var(--faint); font-size: 11px; white-space: nowrap; }
  .news .pub { color: var(--muted); font-size: 11.5px; }

  .msg { text-align: center; color: var(--muted); margin-top: 24px; }
  .msg .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .loading { opacity: .5; transition: opacity .15s; }
  [hidden] { display: none !important; }

  @media (max-width: 760px) {
    .search { gap: 12px; margin: 32px 0 28px; }
    .field { width: 100%; }
    .cols { display: none; }
    .head { grid-template-columns: 1fr auto; row-gap: 8px; }
    .head .spark, .head .mcap { display: none; }
    .grid, .lower { grid-template-columns: 1fr; gap: 18px; }
    .tip { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<nav class="band" id="band" aria-label="Tickers"></nav>
<main class="wrap">
  <form class="search" id="form" autocomplete="off">
    <div class="field">
      <input id="q" placeholder="Company or ticker" aria-label="Company or ticker" spellcheck="false">
      <ul class="suggest" id="suggest" hidden></ul>
    </div>
    <button class="btn" type="submit">GET DATA</button>
    <button class="btn ghost" type="button" id="reset">RESET</button>
  </form>

  <section id="card" hidden>
    <div class="cols"><span></span><span>14 DAYS</span><span>M/CAP</span><span>PRICE</span></div>
    <div class="head">
      <div class="tk" id="c-tk"></div>
      <div><div class="nm" id="c-nm"></div><div class="sub" id="c-sub"></div></div>
      <svg class="spark" id="c-spark" width="76" height="24" viewBox="0 0 76 24" aria-hidden="true"></svg>
      <div class="num mcap" id="c-mcap"></div>
      <div class="num price" id="c-price"></div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="panel">
      <div class="who" id="p-nm"></div>
      <div class="who-sub" id="p-sec"></div>
      <div class="who-sub" id="p-ex"></div>
      <div class="asof" id="p-asof"></div>
      <div class="grid">
        <div><h3 class="sec">Momentum Signals</h3><div id="momentum"></div></div>
        <div><h3 class="sec">Fundamentals</h3><div id="fundamentals"></div></div>
      </div>
      <div class="lower">
        <div><h3 class="sec">Dividends &amp; Fundamentals</h3><div class="kv" id="divs"></div></div>
        <div><h3 class="sec">Recent News</h3><div id="news"></div></div>
      </div>
    </div>
  </section>

  <div class="msg" id="msg" hidden></div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const NA = 'N/A';
  let tickers = [];
  let current = null;

  // ---- formatting ----
  const money = (v) => v == null ? NA : '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const big = (v) => {
    if (v == null) return NA;
    for (const [d, s] of [[1e12, 'T'], [1e9, 'B'], [1e6, 'M']]) if (Math.abs(v) >= d) return '$' + (v / d).toFixed(1) + s;
    return '$' + v.toFixed(0);
  };
  const pct = (v) => v == null ? NA : v.toFixed(2) + '%';
  const signedPct = (v) => v == null ? '' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
  const day = (t) => t == null ? NA : new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }).format(new Date(t * 1000));
  const stamp = (t) => {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
      day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC',
    }).formatToParts(new Date(t * 1000)).map((x) => [x.type, x.value]));
    return `${p.day} ${p.month} ${p.year}, ${p.hour}:${p.minute} UTC`;
  };
  const ago = (t) => {
    const s = Math.max(0, Date.now() / 1000 - t);
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    if (s < 86400 * 30) return Math.round(s / 86400) + 'd ago';
    if (s < 86400 * 365) return Math.round(s / (86400 * 30)) + 'mo ago';
    return Math.round(s / (86400 * 365)) + 'y ago';
  };
  const tone = (s) => !s.available ? 'na' : s.strength >= 60 ? 'up' : s.strength <= 40 ? 'down' : '';
  const barColor = (s) => !s.available ? 'transparent' : s.strength >= 60 ? 'var(--bar-good)' : s.strength <= 40 ? 'var(--bar-bad)' : 'var(--bar-mid)';

  async function api(path) {
    const res = await fetch(path);
    return { ok: res.ok, status: res.status, body: await res.json() };
  }

  // ---- ticker band ----
  function chip(q, onClick) {
    const b = el('button', 'chip');
    b.type = 'button';
    b.dataset.ticker = q.ticker;
    b.append(el('b', null, q.ticker));
    if (q.price != null) b.append(el('span', null, money(q.price)));
    if (q.change_pct != null) b.append(el('span', 'chg ' + (q.change_pct >= 0 ? 'up' : 'down'), signedPct(q.change_pct)));
    b.addEventListener('click', () => onClick(q.ticker));
    return b;
  }
  function renderBand(quotes) {
    const band = $('band');
    band.replaceChildren(...quotes.map((q) => chip(q, load)));
    markActive();
  }
  function markActive() {
    for (const c of $('band').children) c.classList.toggle('active', c.dataset.ticker === current);
  }
  async function initBand() {
    const { body } = await api('api/tickers');
    tickers = body;
    renderBand(body);
    try {
      const live = await api('api/tickers/live');
      if (live.ok) renderBand(live.body);
    } catch (_) { /* keep snapshot prices */ }
  }

  // ---- search + suggestions ----
  const q = $('q');
  const list = $('suggest');
  let hits = [];
  let sel = -1;
  let timer = null;

  function showSuggest() {
    list.replaceChildren(...hits.map((h, i) => {
      const li = el('li', i === sel ? 'on' : '');
      li.append(el('b', null, h.ticker), el('span', null, h.name));
      li.addEventListener('mousedown', (e) => { e.preventDefault(); pick(h.ticker); });
      return li;
    }));
    list.hidden = hits.length === 0;
  }
  async function suggest() {
    const term = q.value.trim();
    if (!term) { hits = []; showSuggest(); return; }
    const { body } = await api('api/search?q=' + encodeURIComponent(term));
    if (q.value.trim() !== term) return;
    hits = body; sel = -1; showSuggest();
  }
  function pick(ticker) {
    hits = []; showSuggest();
    load(ticker);
  }
  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(suggest, 150); });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' && hits.length) { sel = (sel + 1) % hits.length; showSuggest(); e.preventDefault(); }
    else if (e.key === 'ArrowUp' && hits.length) { sel = (sel - 1 + hits.length) % hits.length; showSuggest(); e.preventDefault(); }
    else if (e.key === 'Escape') { hits = []; showSuggest(); }
  });
  q.addEventListener('blur', () => { hits = []; showSuggest(); });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const term = q.value.trim();
    if (!term) return;
    if (sel >= 0 && hits[sel]) return pick(hits[sel].ticker);
    const { body } = await api('api/search?q=' + encodeURIComponent(term));
    if (body.length) pick(body[0].ticker);
    else notFound(term);
  });
  $('reset').addEventListener('click', () => {
    q.value = ''; hits = []; showSuggest();
    current = null; markActive();
    $('card').hidden = true; $('msg').hidden = true;
    q.focus();
  });

  // ---- card ----
  async function load(ticker) {
    current = ticker; markActive();
    $('card').classList.add('loading');
    try {
      const { ok, body } = await api('api/company/' + encodeURIComponent(ticker));
      // A newer click or search has superseded this request.
      if (current !== ticker) return;
      if (!ok) return notFound(ticker);
      q.value = body.card.ticker;
      render(body.card, body.tip);
    } finally {
      $('card').classList.remove('loading');
    }
  }

  function notFound(term) {
    $('card').hidden = true;
    const m = $('msg');
    const chips = el('div', 'chips');
    chips.append(...tickers.map((t) => chip({ ticker: t.ticker }, load)));
    m.replaceChildren(el('div', null, `We don't have "${term}" in this demo. Try one of these:`), chips);
    m.hidden = false;
  }

  function sparkline(svg, values) {
    svg.replaceChildren();
    if (values.length < 2) return;
    const [w, h, pad] = [76, 24, 2];
    const min = Math.min(...values), max = Math.max(...values);
    const span = max - min || 1;
    const pts = values.map((v, i) => [
      pad + (i * (w - 2 * pad)) / (values.length - 1),
      h - pad - ((v - min) * (h - 2 * pad)) / span,
    ]);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    path.setAttribute('points', pts.map((p) => p.map((n) => n.toFixed(1)).join(',')).join(' '));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('stroke', values[values.length - 1] >= values[0] ? 'var(--good)' : 'var(--bad)');
    svg.append(path);
  }

  function signals(container, list) {
    container.replaceChildren(...list.map((s) => {
      const row = el('div', 'sig');
      const bar = el('i');
      bar.style.width = (s.available ? s.strength : 0) + '%';
      bar.style.background = barColor(s);
      row.append(el('span', 'n', s.name), el('span', 'l ' + tone(s), s.label), bar);
      return row;
    }));
  }

  function renderTip(tip) {
    const box = $('tip');
    const body = tip.url ? el('a') : el('span');
    if (tip.url) { body.href = tip.url; body.target = '_blank'; body.rel = 'noopener'; }
    body.append(el('span', 'tt', tip.title), el('span', 'tx', tip.text));
    const parts = [el('span', 'k', 'Tip from Drupal'), body];
    if (tip.offline) parts.push(el('span', 'off', 'offline'));
    box.replaceChildren(...parts);
  }

  function render(c, tip) {
    $('msg').hidden = true;
    $('c-tk').textContent = c.ticker;
    $('c-nm').textContent = c.name;
    $('c-sub').textContent = [c.sector, c.exchange].filter(Boolean).join(' · ');
    sparkline($('c-spark'), c.spark);
    $('c-mcap').textContent = big(c.market_cap);
    $('c-price').textContent = money(c.price);
    renderTip(tip);

    $('p-nm').textContent = c.name;
    $('p-sec').textContent = c.sector || '';
    $('p-ex').textContent = c.exchange || '';
    $('p-asof').textContent = stamp(c.as_of);
    signals($('momentum'), c.momentum);
    signals($('fundamentals'), c.fundamentals);

    const d = c.dividend;
    const growth = d.growth_5y_pct;
    const rows = [
      ['Dividend Yield (TTM)', pct(d.yield_pct)],
      ['Per Share (Annual)', money(d.rate_annual), 'down'],
      ['5Y Growth Rate', growth == null ? NA : pct(growth), growth == null ? 'down' : growth >= 0 ? 'up' : 'down'],
      ['Payout Ratio', pct(d.payout_ratio_pct), 'up'],
      ['Ex-Dividend Date', day(d.ex_date)],
      ['Payment Date', day(d.pay_date)],
      ['Market Cap', big(c.market_cap)],
    ];
    $('divs').replaceChildren(...rows.flatMap(([k, v, cls]) => [el('span', null, k), el('span', v === NA ? 'down' : cls || '', v)]));

    $('news').replaceChildren(...(c.news.length ? c.news.map((n) => {
      const item = el('div', 'news');
      const top = el('div', 'top');
      const title = n.link ? el('a', null, n.title) : el('span', null, n.title);
      if (n.link) { title.href = n.link; title.target = '_blank'; title.rel = 'noopener'; }
      top.append(title, el('span', 'age', ago(n.published_at)));
      item.append(top);
      if (n.publisher) item.append(el('div', 'pub', n.publisher));
      return item;
    }) : [el('div', 'pub', 'No recent news.')]));

    $('card').hidden = false;
  }

  initBand();
  q.focus();
})();
</script>
</body>
</html>
